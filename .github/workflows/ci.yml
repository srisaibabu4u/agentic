name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  KYC_DATABASE_URL: postgresql+psycopg://kyc:kyc@localhost:5432/kyc

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: kyc, POSTGRES_PASSWORD: kyc, POSTGRES_DB: kyc }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U kyc -d kyc" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "**/requirements.txt" }
      - run: pip install -r requirements.txt -r backend/requirements.txt
      - name: Prototype routing tests
        run: python tests/test_routing.py
      - name: Migrations (and models agree with them)
        working-directory: backend
        run: alembic upgrade head && alembic check
      - name: Seed
        working-directory: backend
        run: python -m kyc.seed --clients 25 --reset --as-of 2026-10-31
      - name: Backend tests
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - name: Type check and build
        run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: kyc, POSTGRES_PASSWORD: kyc, POSTGRES_DB: kyc }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U kyc -d kyc" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Backend into ./venv (the Playwright config starts the API and worker from it)
        run: python -m venv venv && venv/bin/pip install -r requirements.txt -r backend/requirements.txt
      - name: Migrations
        working-directory: backend
        run: ../venv/bin/alembic upgrade head
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: End-to-end tests (installed Chrome)
        working-directory: frontend
        run: npm ci && npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: e2e-results, path: frontend/test-results, retention-days: 7 }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the whole stack
        run: |
          echo "KYC_JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')" > .env
          docker compose up -d --build --wait
      - name: Smoke test through nginx
        run: |
          curl -fsS http://localhost:8080/api/health
          curl -fsS -o /dev/null -w "%{http_code}\n" http://localhost:8080/
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/cases)" = 401
      - if: always()
        run: docker compose logs --no-color | tail -n 200; docker compose down -v
