# Serves the built UI and forwards /api/* to the API container, so the browser sees one origin
# (the session cookie is same-site, and no CORS is needed).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 2m;   # maker uploads are text documents

    location /api/ {
        include /etc/nginx/snippets/security.conf;
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # server-sent events: pass each message through as it comes, and keep the stream open
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # hashed build assets can be cached for good; the app shell must not be
    location /assets/ {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
